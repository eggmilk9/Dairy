<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="일기">
  <meta name="theme-color" content="#F2EEE7">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>오늘의 일기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#F2EEE7;padding-top:env(safe-area-inset-top);overscroll-behavior:none}
    button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
    textarea{-webkit-user-select:text;user-select:text}

    .wrap{min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px calc(28px + env(safe-area-inset-bottom));background:#F2EEE7}
    .card{background:#FAF8F3;border-radius:20px;padding:24px 22px 18px;width:100%;max-width:440px;box-shadow:0 2px 20px rgba(44,40,36,.07);display:flex;flex-direction:column;min-height:calc(100dvh - 96px)}

    .hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:8px}
    .date-label{font-size:10px;color:#C8A87A;letter-spacing:.1em;font-weight:500;margin-bottom:5px}
    .date-main{font-family:'Noto Serif KR',serif;font-size:14px;color:#9B9089}
    .hdr-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}

    .icon-btn{background:none;border:none;cursor:pointer;color:#B0A49A;padding:8px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:color .15s,background .15s;min-width:44px;min-height:44px}
    .icon-btn:active{color:#2A2826;background:#EDE7DF}
    .back-today{background:rgba(123,158,135,.12);border:none;cursor:pointer;color:#7B9E87;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;padding:6px 11px;border-radius:20px;white-space:nowrap}

    /* Photos */
    .photo-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;width:100%}
    .photo-strip.single .photo-box{width:100%}
    .photo-strip.multi .photo-box{width:calc(50% - 4px)}
    .photo-box{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;flex-shrink:0;-webkit-touch-callout:none;user-select:none}
    .photo-box img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .photo-del{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s;pointer-events:none}
    .photo-del.show{opacity:1;transform:scale(1);pointer-events:auto}

    textarea{width:100%;min-height:140px;height:140px;border:none;outline:none;background:transparent;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.85;color:#2A2826;resize:none;padding:0;overflow:hidden;display:block}
    textarea::placeholder{color:#C8BBAF}

    .divider{height:1px;background:#E8DDD0;margin:14px 0 12px}
    .bar{display:flex;align-items:center;gap:4px}
    .save-txt{margin-left:auto;font-size:12px;color:#B0A49A;min-width:60px;text-align:right;transition:color .3s}
    .save-ok{color:#7B9E87!important}

    /* Overlays */
    .overlay{position:fixed;inset:0;background:rgba(44,40,36,.38);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
    .modal{background:#FAF8F3;border-radius:20px;padding:22px;width:100%;max-width:320px;box-shadow:0 12px 40px rgba(44,40,36,.2)}

    /* Calendar */
    .cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .cal-title{font-family:'Noto Serif KR',serif;font-size:15px;color:#2A2826;font-weight:600}
    .wd-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
    .wd{text-align:center;font-size:11px;color:#B0A49A;padding:2px 0}
    .day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
    .day{display:flex;flex-direction:column;align-items:center;justify-content:center;height:40px;border-radius:8px;cursor:pointer}
    .day:active:not(.future){background:#EDE7DF}
    .day.future{opacity:.25;cursor:default;pointer-events:none}
    .day.today .dn{color:#7B9E87;font-weight:600}
    .day.today{background:rgba(123,158,135,.1)}
    .day.active .dn{color:#C8A87A;font-weight:600}
    .day.active{background:rgba(200,168,122,.1)}
    .dn{font-size:13px;color:#2A2826;line-height:1}
    .dot{width:4px;height:4px;border-radius:50%;margin-top:3px;background:transparent}
    .dot.has{background:#7B9E87}
    .legend{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px}
    .legend-dot{width:6px;height:6px;border-radius:50%;background:#7B9E87}
    .legend-txt{font-size:11px;color:#B0A49A}

    /* Select mode */
    .day.no-sel{opacity:.18;pointer-events:none}
    .day.sel-on{background:#7B9E87!important}
    .day.sel-on .dn{color:#fff!important;font-weight:600}
    .day.sel-on .dot{background:rgba(255,255,255,.55)!important}
    .sel-bar{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid #E8DDD0}
    .sel-all{background:none;border:1px solid #C8BBAF;color:#9B9089;font-size:12px;font-family:'Noto Sans KR',sans-serif;padding:7px 12px;border-radius:16px;cursor:pointer;white-space:nowrap}
    .sel-count{font-size:12px;color:#9B9089;flex:1;text-align:center}
    .sel-dl{background:#7B9E87;border:none;color:#fff;font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;padding:8px 16px;border-radius:16px;cursor:pointer;white-space:nowrap}
    .sel-dl:disabled{opacity:.35;cursor:default}
    .sel-cancel{background:none;border:none;cursor:pointer;font-size:13px;color:#B0A49A;font-family:'Noto Sans KR',sans-serif;padding:4px 0;min-width:36px}
    .sel-title{font-family:'Noto Serif KR',serif;font-size:15px;color:#2A2826;font-weight:600;text-align:center;flex:1}

    /* Export name modal */
    .export-modal{background:#FAF8F3;border-radius:20px;padding:24px 22px;width:100%;max-width:320px;box-shadow:0 12px 40px rgba(44,40,36,.2)}
    .export-modal-title{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;color:#2A2826;margin-bottom:16px}
    .export-input{width:100%;border:1.5px solid #E8DDD0;border-radius:10px;padding:11px 13px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:#2A2826;background:#fff;outline:none;box-sizing:border-box}
    .export-input:focus{border-color:#7B9E87}
    .export-ext{font-size:12px;color:#B0A49A;margin-top:6px;margin-bottom:20px}
    .export-btns{display:flex;gap:10px}
    .export-cancel{flex:1;background:none;border:1.5px solid #E8DDD0;border-radius:12px;padding:11px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:#9B9089;cursor:pointer}
    .export-confirm{flex:2;background:#7B9E87;border:none;border-radius:12px;padding:11px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:500;color:#fff;cursor:pointer}

    /* Export toast */
    .toast{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#2A2826;color:#FAF8F3;font-size:13px;padding:10px 18px;border-radius:20px;white-space:nowrap;z-index:200;pointer-events:none;opacity:0;transition:opacity .25s}
    .toast.show{opacity:1}

    @keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(123,158,135,.5)}70%{box-shadow:0 0 0 10px rgba(123,158,135,0)}}
    .rec{animation:mic-pulse 1.5s ease infinite;border-radius:10px}

    .loading{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#F2EEE7;font-size:14px;color:#B0A49A}

    /* Entry navigation */
    .nav-row{display:flex;align-items:center;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1px solid #F0E8DE}
    .nav-btn{background:none;border:none;cursor:pointer;color:#C8BBAF;padding:6px 12px;border-radius:8px;display:flex;align-items:center;justify-content:center;min-width:44px;min-height:36px;transition:color .15s,background .15s}
    .nav-btn:not(:disabled):active{background:#EDE7DF;color:#2A2826}
    .nav-btn:disabled{opacity:.25;cursor:default}
    .nav-pos{font-size:11px;color:#C8BBAF;letter-spacing:.03em}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

const {useState, useEffect, useRef, useCallback} = React;
const WD = ['일','월','화','수','목','금','토'];
const MO = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

/* ── IndexedDB ── */
const DB = (() => {
  let _db = null;
  const open = () => new Promise((res, rej) => {
    if (_db) return res(_db);
    const r = indexedDB.open('diary_app', 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore('entries', {keyPath:'id'});
    r.onsuccess = e => { _db = e.target.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const tx = db.transaction('entries', mode);
    const req = fn(tx.objectStore('entries'));
    if (req) { req.onsuccess = () => res(req.result ?? null); req.onerror = () => rej(req.error); }
    else { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }
  }));
  return {
    get:   id    => run('readonly',  s => s.get(id)),
    put:   entry => run('readwrite', s => { s.put(entry); }),
    del:   id    => run('readwrite', s => { s.delete(id); }),
    keys:  ()    => run('readonly',  s => s.getAllKeys()),
    getAll:()    => run('readonly',  s => s.getAll()),
  };
})();

/* ── Utils ── */
function toKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function korDate(k) {
  const [y,m,d] = k.split('-').map(Number);
  return `${y}년 ${m}월 ${d}일 ${WD[new Date(y,m-1,d).getDay()]}요일`;
}
function b64ToArr(b64) {
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

/* ── DOCX helpers (no external libs) ── */
function escapeXml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function crc32(u8){let c=-1;for(let i=0;i<u8.length;i++){c^=u8[i];for(let j=0;j<8;j++)c=(c>>>1)^(c&1?0xEDB88320:0);}return(c^-1)>>>0;}
function makeZip(files){
  const enc=new TextEncoder(),entries=[];let offset=0;
  for(const{name,data}of files){
    const nb=enc.encode(name),d=typeof data==='string'?enc.encode(data):data,crc=crc32(d);
    const lh=new Uint8Array(30+nb.length+d.length);
    const w=(v,p,n)=>{for(let i=0;i<n;i++)lh[p+i]=(v>>>(i*8))&0xFF;};
    lh.set([80,75,3,4]);w(20,4,2);w(0,6,2);w(0,8,2);w(0,10,4);
    w(crc,14,4);w(d.length,18,4);w(d.length,22,4);w(nb.length,26,2);w(0,28,2);
    lh.set(nb,30);lh.set(d,30+nb.length);
    entries.push({nb,d,crc,lh,offset});offset+=lh.length;
  }
  const cdOffset=offset;
  const cds=entries.map(({nb,d,crc,offset})=>{
    const cd=new Uint8Array(46+nb.length);
    const w=(v,p,n)=>{for(let i=0;i<n;i++)cd[p+i]=(v>>>(i*8))&0xFF;};
    cd.set([80,75,1,2]);w(20,4,2);w(20,6,2);w(0,8,2);w(0,10,2);w(0,12,4);
    w(crc,16,4);w(d.length,20,4);w(d.length,24,4);w(nb.length,28,2);
    w(0,30,6);w(0,36,2);w(0,38,4);w(offset,42,4);cd.set(nb,46);return cd;
  });
  const cdSize=cds.reduce((s,c)=>s+c.length,0),eocd=new Uint8Array(22);
  const w=(v,p,n)=>{for(let i=0;i<n;i++)eocd[p+i]=(v>>>(i*8))&0xFF;};
  eocd.set([80,75,5,6]);w(0,4,4);w(entries.length,8,2);w(entries.length,10,2);
  w(cdSize,12,4);w(cdOffset,16,4);w(0,20,2);
  const all=[...entries.map(e=>e.lh),...cds,eocd];
  const total=all.reduce((s,a)=>s+a.length,0),out=new Uint8Array(total);
  let pos=0;for(const a of all){out.set(a,pos);pos+=a.length;}return out;
}

/* ── Icons ── */
const E = React.createElement;
const svg = (w,h,ch) => E('svg',{width:w,height:h,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.7,strokeLinecap:'round',strokeLinejoin:'round'},...ch);
const CalIcon  = () => svg(20,20,[E('rect',{key:'r',x:3,y:4,width:18,height:18,rx:2}),E('line',{key:'1',x1:16,y1:2,x2:16,y2:6}),E('line',{key:'2',x1:8,y1:2,x2:8,y2:6}),E('line',{key:'3',x1:3,y1:10,x2:21,y2:10})]);
const MicIcon  = ({on}) => svg(20,20,[E('rect',{key:'r',x:9,y:2,width:6,height:11,rx:3,stroke:on?'#7B9E87':'currentColor'}),E('path',{key:'p',d:'M5 10a7 7 0 0 0 14 0',stroke:on?'#7B9E87':'currentColor'}),E('line',{key:'1',x1:12,y1:19,x2:12,y2:23,stroke:on?'#7B9E87':'currentColor'}),E('line',{key:'2',x1:8,y1:23,x2:16,y2:23,stroke:on?'#7B9E87':'currentColor'})]);
const ImgIcon  = () => svg(20,20,[E('rect',{key:'r',x:3,y:3,width:18,height:18,rx:2}),E('circle',{key:'c',cx:8.5,cy:8.5,r:1.5}),E('polyline',{key:'p',points:'21 15 16 10 5 21'})]);
const XIcon    = ({s=14}) => E('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.5,strokeLinecap:'round'},E('line',{key:'a',x1:18,y1:6,x2:6,y2:18}),E('line',{key:'b',x1:6,y1:6,x2:18,y2:18}));
const ChL      = () => E('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round'},E('polyline',{points:'15 18 9 12 15 6'}));
const ChR      = () => E('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round'},E('polyline',{points:'9 18 15 12 9 6'}));
const DlIcon   = () => svg(20,20,[E('path',{key:'p',d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),E('polyline',{key:'pl',points:'7 10 12 15 17 10'}),E('line',{key:'l',x1:12,y1:15,x2:12,y2:3})]);

/* ── App ── */
function App() {
  const todayKey = toKey(new Date());

  const [loading,    setLoading]    = useState(true);
  const [entryKeys,  setEntryKeys]  = useState(new Set());
  const [activeKey,  setActiveKey]  = useState(todayKey);
  const [text,       setText]       = useState('');
  const [photos,     setPhotos]     = useState([]);
  const [saveState,  setSaveState]  = useState('idle');
  const [showCal,    setShowCal]    = useState(false);
  const [calY,       setCalY]       = useState(new Date().getFullYear());
  const [calM,       setCalM]       = useState(new Date().getMonth());
  const [recording,  setRecording]  = useState(false);
  const [delIdx,     setDelIdx]     = useState(null);
  const [exporting,  setExporting]  = useState(false);
  const [toast,      setToast]      = useState('');
  const [selectMode, setSelectMode] = useState(false);
  const [selectedDays, setSelectedDays] = useState(new Set());
  const [showExportModal, setShowExportModal] = useState(false);
  const [exportName, setExportName] = useState('');
  const [pendingKeys, setPendingKeys] = useState(null);

  const fileRef      = useRef(null);
  const textareaRef  = useRef(null);
  const recRef       = useRef(null);
  const finalRef     = useRef('');
  const saveTimer    = useRef(null);
  const skipSave     = useRef(false);
  const textRef      = useRef(text);
  const photosRef    = useRef(photos);
  const lpTimer      = useRef(null);
  const activeKeyRef = useRef(activeKey);
  const prevKeyRef   = useRef(activeKey);
  const toastTimer   = useRef(null);
  textRef.current    = text;
  photosRef.current  = photos;
  activeKeyRef.current = activeKey;

  /* Load */
  useEffect(() => {
    (async () => {
      try {
        const today = await DB.get(todayKey);
        if (today) { setText(today.text || ''); setPhotos(today.photos || []); }
        const keys = await DB.keys();
        setEntryKeys(new Set(keys));
      } catch(e) {}
      setLoading(false);
    })();
  }, []);

  /* Save */
  const save = useCallback((t, p, key) => {
    clearTimeout(saveTimer.current);
    setSaveState('saving');
    saveTimer.current = setTimeout(async () => {
      try {
        if (!t.trim() && !p.length) {
          await DB.del(key);
          setEntryKeys(prev => { const s = new Set(prev); s.delete(key); return s; });
        } else {
          await DB.put({ id: key, text: t, photos: p });
          setEntryKeys(prev => new Set([...prev, key]));
        }
        setSaveState('saved');
        setTimeout(() => setSaveState('idle'), 2200);
      } catch(e) { setSaveState('idle'); }
    }, 900);
  }, []);

  useEffect(() => {
    if (loading) return;
    if (skipSave.current) { skipSave.current = false; return; }
    save(text, photos, activeKeyRef.current);
  }, [text, photos, loading]);

  /* Switch date */
  useEffect(() => {
    if (loading) return;
    const prev = prevKeyRef.current;
    prevKeyRef.current = activeKey;
    if (prev === activeKey) return;
    clearTimeout(saveTimer.current);
    const t = textRef.current, p = photosRef.current;
    if (!t.trim() && !p.length) {
      DB.del(prev).then(() => setEntryKeys(s => { const n = new Set(s); n.delete(prev); return n; })).catch(()=>{});
    } else {
      DB.put({ id: prev, text: t, photos: p }).then(() => setEntryKeys(s => new Set([...s, prev]))).catch(()=>{});
    }
    skipSave.current = true;
    DB.get(activeKey).then(entry => { setText(entry?.text || ''); setPhotos(entry?.photos || []); }).catch(() => { setText(''); setPhotos([]); });
  }, [activeKey]);

  /* Auto-grow textarea so it never scrolls internally — the whole card/page scrolls instead */
  const autoGrow = useCallback(() => {
    const el = textareaRef.current;
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.max(el.scrollHeight, 140) + 'px';
  }, []);

  useEffect(() => { autoGrow(); }, [text, photos.length, loading, activeKey, autoGrow]);

  /* Photos */
  const cropSquare = f => new Promise(res => {
    const fr = new FileReader();
    fr.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        const ss = Math.min(img.width, img.height), sz = Math.min(ss, 480);
        c.width = c.height = sz;
        c.getContext('2d').drawImage(img,(img.width-ss)/2,(img.height-ss)/2,ss,ss,0,0,sz,sz);
        res(c.toDataURL('image/jpeg', .72));
      };
      img.src = ev.target.result;
    };
    fr.readAsDataURL(f);
  });

  const handlePhotos = async e => {
    const files = [...e.target.files];
    const processed = await Promise.all(files.map(cropSquare));
    setPhotos(p => [...p, ...processed]);
    e.target.value = '';
  };

  /* Voice */
  const toggleRec = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('이 브라우저에서는 음성 인식이 지원되지 않습니다.'); return; }
    if (recording) { recRef.current?.stop(); return; }
    const r = new SR();
    r.lang = 'ko-KR'; r.continuous = true; r.interimResults = true;
    finalRef.current = textRef.current;
    r.onresult = ev => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalRef.current += ev.results[i][0].transcript;
        else interim += ev.results[i][0].transcript;
      }
      setText(finalRef.current + interim);
    };
    r.onend  = () => { setText(finalRef.current); setRecording(false); };
    r.onerror = () => setRecording(false);
    r.start(); recRef.current = r; setRecording(true);
  };

  /* Long-press delete */
  const startLP = i => { lpTimer.current = setTimeout(() => { setDelIdx(i); if (navigator.vibrate) navigator.vibrate(40); }, 550); };
  const cancelLP = () => clearTimeout(lpTimer.current);
  const dismissDel = ev => { if (!ev.target.closest?.('.photo-box')) setDelIdx(null); };

  /* Toast */
  const showToast = msg => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2800);
  };

  /* ── Export to .docx (Pages에서 바로 열림, 사진 포함) ── */
  const doExport = async (keySet, customName) => {
    setExporting(true);
    showToast('📄 내보내기 준비 중...');
    try {
      const curT=textRef.current,curP=photosRef.current,curK=activeKeyRef.current;
      if(curT.trim()||curP.length) await DB.put({id:curK,text:curT,photos:curP});

      const allEntries = await DB.getAll();
      const entries = keySet ? allEntries.filter(e=>keySet.has(e.id)) : allEntries;
      entries.sort((a,b)=>a.id.localeCompare(b.id));
      if(!entries.length){showToast('선택된 일기가 없어요');setExporting(false);return;}

      const imgs=[];let imgN=0;
      const body=[];

      // 제목
      body.push(`<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="400"/></w:pPr><w:r><w:rPr><w:b/><w:color w:val="7B9E87"/><w:sz w:val="52"/></w:rPr><w:t>나의 일기</w:t></w:r></w:p>`);

      for(const entry of entries){
        // 날짜
        body.push(`<w:p><w:pPr><w:spacing w:before="480" w:after="120"/></w:pPr><w:r><w:rPr><w:b/><w:color w:val="7B9E87"/><w:sz w:val="28"/></w:rPr><w:t>${escapeXml(korDate(entry.id))}</w:t></w:r></w:p>`);
        // 구분선
        body.push(`<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="4" w:space="1" w:color="E8DDD0"/></w:pBdr><w:spacing w:after="160"/></w:pPr></w:p>`);

        // 사진
        for(const src of (entry.photos||[])){
          imgN++;
          const rId=`rId${100+imgN}`;
          imgs.push({n:imgN,rId,data:b64ToArr(src.split(',')[1])});
          const emu=2160000;
          body.push(`<w:p><w:pPr><w:spacing w:after="120"/></w:pPr><w:r><w:drawing><wp:inline xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${emu}" cy="${emu}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${imgN}" name="Img${imgN}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${imgN}" name="Img${imgN}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${emu}" cy="${emu}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`);
        }

        // 글
        if(entry.text?.trim()){
          for(const line of entry.text.split('\n'))
            body.push(`<w:p><w:pPr><w:spacing w:after="60"/></w:pPr><w:r><w:rPr><w:sz w:val="24"/><w:color w:val="2A2826"/></w:rPr><w:t xml:space="preserve">${escapeXml(line||' ')}</w:t></w:r></w:p>`);
        } else {
          body.push(`<w:p><w:r><w:rPr><w:sz w:val="22"/><w:color w:val="B0A49A"/><w:i/></w:rPr><w:t>(내용 없음)</w:t></w:r></w:p>`);
        }
      }

      const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"><w:body>${body.join('')}<w:sectPr><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>`;
      const relsXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${imgs.map(i=>`<Relationship Id="${i.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i.n}.jpeg"/>`).join('')}</Relationships>`;
      const ctXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
      const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;

      const zipBytes=makeZip([
        {name:'[Content_Types].xml',data:ctXml},
        {name:'_rels/.rels',data:rootRels},
        {name:'word/document.xml',data:docXml},
        {name:'word/_rels/document.xml.rels',data:relsXml},
        ...imgs.map(i=>({name:`word/media/image${i.n}.jpeg`,data:i.data}))
      ]);

      const blob=new Blob([zipBytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      const filename=`${(customName||'일기_'+toKey(new Date()).replace(/-/g,''))}.docx`;
      const file=new File([blob],filename,{type:blob.type});
      if(navigator.share&&navigator.canShare?.({files:[file]})){
        await navigator.share({files:[file],title:'나의 일기'});
      } else {
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download=filename;a.click();
        URL.revokeObjectURL(url);
      }
      showToast(`✓ ${entries.length}개 내보내기 완료`);
    } catch(e){
      if(e.name!=='AbortError') showToast('내보내기 실패: '+e.message);
      else showToast('');
    }
    setExporting(false);
  };

  /* Calendar */
  const navM = dir => { let y=calY, m=calM+dir; if(m<0){y--;m=11;} if(m>11){y++;m=0;} setCalY(y); setCalM(m); };
  const closeCal = () => { setShowCal(false); setSelectMode(false); setSelectedDays(new Set()); };
  const enterSelect = () => { setSelectMode(true); setSelectedDays(new Set()); };
  const onDayClick = dk => {
    if (dk > todayKey) return;
    if (selectMode) {
      if (!entryKeys.has(dk)) return;
      setSelectedDays(prev => { const n = new Set(prev); n.has(dk) ? n.delete(dk) : n.add(dk); return n; });
    } else {
      setActiveKey(dk); closeCal();
    }
  };
  const allSelectable = [...entryKeys];
  const allSelected = allSelectable.length > 0 && allSelectable.every(k => selectedDays.has(k));
  const toggleAll = () => setSelectedDays(allSelected ? new Set() : new Set(allSelectable));

  const calCells = () => {
    const total = new Date(calY, calM+1, 0).getDate(), start = new Date(calY, calM, 1).getDay(), cells = [];
    for (let i = 0; i < start; i++) cells.push(E('div', {key:'e'+i}));
    for (let d = 1; d <= total; d++) {
      const dk = `${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isT = dk===todayKey, isActive = dk===activeKey && dk!==todayKey;
      const has = entryKeys.has(dk), fut = dk>todayKey;
      const noSel = selectMode && !has && !fut;
      const selOn  = selectMode && selectedDays.has(dk);
      const cls = ['day',
        isT&&!selectMode?'today':'',
        isActive&&!selectMode?'active':'',
        fut?'future':'',
        noSel?'no-sel':'',
        selOn?'sel-on':'',
      ].filter(Boolean).join(' ');
      cells.push(E('div', {key:dk, className:cls, onClick:()=>onDayClick(dk)},
        E('span', {className:'dn'}, d),
        E('div',  {className:`dot${has?' has':''}`})
      ));
    }
    return cells;
  };

  /* Entry navigation */
  const sortedKeys = [...entryKeys].sort();
  const curIdx     = sortedKeys.indexOf(activeKey);
  const prevKey    = curIdx > 0 ? sortedKeys[curIdx - 1] : null;
  const nextKey    = curIdx >= 0 && curIdx < sortedKeys.length - 1 ? sortedKeys[curIdx + 1] : null;

  if (loading) return E('div', {className:'loading'}, '불러오는 중...');

  return E('div', {className:'wrap'},
    E('div', {className:'card', onClickCapture: dismissDel},

      E('div', {className:'hdr'},
        E('div', {style:{flex:1,minWidth:0}},
          E('div', {className:'date-label'}, activeKey === todayKey ? 'TODAY' : '지난 일기'),
          E('div', {className:'date-main'}, korDate(activeKey))
        ),
        E('div', {className:'hdr-actions'},
          activeKey !== todayKey && E('button', {className:'back-today', onClick:()=>setActiveKey(todayKey)}, '← 오늘'),
          E('button', {className:'icon-btn', onClick:()=>setShowCal(true), 'aria-label':'달력'}, E(CalIcon))
        )
      ),

      photos.length > 0 && E('div', {className:`photo-strip${photos.length === 1 ? ' single' : ' multi'}`},
        photos.map((src, i) => E('div', {key:i, className:'photo-box',
          onTouchStart:()=>startLP(i), onTouchEnd:cancelLP, onTouchMove:cancelLP,
          onMouseDown:()=>startLP(i), onMouseUp:cancelLP, onMouseLeave:cancelLP,
          onContextMenu:ev=>{ev.preventDefault();startLP(i);},
          onClick:()=>{if(delIdx===i)setDelIdx(null);}},
          E('img', {src, alt:'', draggable:false}),
          E('button', {className:`photo-del${delIdx===i?' show':''}`, 'aria-label':'사진 삭제',
            onClick:ev=>{ev.stopPropagation();setPhotos(p=>p.filter((_,j)=>j!==i));setDelIdx(null);}},
            E(XIcon, {s:15}))
        ))
      ),

      E('textarea', {
        ref: textareaRef,
        value: text,
        onChange: ev => { if (!recording) setText(ev.target.value); autoGrow(); },
        onInput: autoGrow,
        placeholder: recording ? '🎙 듣고 있어요...' : activeKey === todayKey ? '오늘 하루를 기록해 보세요...' : '이날의 기억을 적어보세요...',
      }),

      E('div', {className:'divider'}),

      E('div', {className:'bar'},
        E('div', {className: recording ? 'rec' : ''},
          E('button', {className:'icon-btn', style:{color:recording?'#7B9E87':''}, onClick:toggleRec, 'aria-label':recording?'중지':'음성 입력'}, E(MicIcon, {on:recording}))
        ),
        E('span', null,
          E('button', {
            className:'icon-btn',
            onClick: () => fileRef.current?.click(),
            'aria-label':'사진 추가'
          }, E(ImgIcon)),
          E('input', {ref:fileRef, type:'file', accept:'image/*', multiple:true, style:{display:'none'}, onChange:handlePhotos})
        ),
        E('span', {className:`save-txt${saveState==='saved'?' save-ok':''}`},
          saveState==='saving' ? '저장 중...' : saveState==='saved' ? '✓ 저장됨' : ''
        )
      ),

      activeKey !== todayKey && sortedKeys.length > 1 && E('div', {className:'nav-row'},
        E('button', {
          className:'nav-btn', disabled:!prevKey,
          onClick: () => prevKey && setActiveKey(prevKey),
          'aria-label':'이전 일기'
        }, E(ChL)),
        E('span', {className:'nav-pos'},
          curIdx >= 0 ? `${curIdx + 1} / ${sortedKeys.length}` : ''
        ),
        E('button', {
          className:'nav-btn', disabled:!nextKey,
          onClick: () => nextKey && setActiveKey(nextKey),
          'aria-label':'다음 일기'
        }, E(ChR))
      )
    ),

    showCal && E('div', {className:'overlay', onClick:closeCal},
      E('div', {className:'modal', onClick:ev=>ev.stopPropagation()},

        /* ─ Normal header ─ */
        !selectMode && E('div', {className:'cal-hdr'},
          E('button', {className:'icon-btn', onClick:()=>navM(-1)}, E(ChL)),
          E('span',   {className:'cal-title'}, `${calY}년 ${MO[calM]}`),
          E('div',    {style:{display:'flex',alignItems:'center',gap:'2px'}},
            E('button', {className:'icon-btn', onClick:()=>navM(1)},  E(ChR)),
            E('button', {className:'icon-btn', onClick:enterSelect, 'aria-label':'날짜 선택해서 내보내기'}, E(DlIcon))
          )
        ),

        /* ─ Select-mode header ─ */
        selectMode && E('div', {className:'cal-hdr'},
          E('button', {className:'sel-cancel', onClick:()=>{setSelectMode(false);setSelectedDays(new Set());}}, '취소'),
          E('span',   {className:'sel-title'}, selectedDays.size ? `${selectedDays.size}개 선택됨` : '날짜 선택'),
          E('div',    {style:{minWidth:'36px'}})
        ),

        E('div', {className:'wd-row'}, WD.map(w => E('div', {key:w, className:'wd'}, w))),
        E('div', {className:'day-grid'}, calCells()),

        /* ─ Normal legend ─ */
        !selectMode && E('div', {className:'legend'},
          E('div',  {className:'legend-dot'}),
          E('span', {className:'legend-txt'}, '일기 쓴 날')
        ),

        /* ─ Select-mode action bar ─ */
        selectMode && E('div', {className:'sel-bar'},
          E('button', {className:'sel-all', onClick:toggleAll},
            allSelected ? '전체 해제' : '전체 선택'
          ),
          E('span', {className:'sel-count'},
            selectedDays.size ? `${selectedDays.size}일 선택` : '날짜를 선택하세요'
          ),
          E('button', {
            className:'sel-dl', disabled:selectedDays.size===0||exporting,
            onClick: () => {
              setPendingKeys(new Set(selectedDays));
              setExportName('일기_' + toKey(new Date()).replace(/-/g,''));
              setShowExportModal(true);
            }
          }, '내보내기')
        )
      )
    ),

    E('div', {className:`toast${toast?' show':''}`}, toast),

    showExportModal && E('div', {className:'overlay', onClick:()=>setShowExportModal(false)},
      E('div', {className:'export-modal', onClick:ev=>ev.stopPropagation()},
        E('div', {className:'export-modal-title'}, '파일 이름'),
        E('input', {
          className:'export-input',
          value: exportName,
          onChange: ev => setExportName(ev.target.value),
          autoFocus: true,
          spellCheck: false,
        }),
        E('div', {className:'export-ext'}, exportName ? exportName+'.docx' : '.docx'),
        E('div', {className:'export-btns'},
          E('button', {className:'export-cancel', onClick:()=>setShowExportModal(false)}, '취소'),
          E('button', {
            className:'export-confirm',
            disabled: !exportName.trim(),
            onClick: async () => {
              setShowExportModal(false);
              closeCal();
              await doExport(pendingKeys, exportName.trim());
            }
          }, '내보내기')
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(E(App));
</script>
</body>
</html>
